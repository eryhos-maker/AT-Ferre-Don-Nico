# Publica la app "Rol de Cajas – Ferre Mina" (carpeta rol-cajas/) en GitHub Pages.
# Requisito único: en GitHub > Settings > Pages, elegir "Source: GitHub Actions".
name: Publicar Rol de Cajas

on:
  push:
    branches: [main]
    paths: ['rol-cajas/**', '.github/workflows/rol-cajas-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar reglas
        run: cd rol-cajas && node --test tests/*.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rol-cajas
      - id: deploy
        uses: actions/deploy-pages@v4
